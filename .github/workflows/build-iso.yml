name: Build RetroGameStation ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      actions: write
    
    container:
      image: archlinux:latest
      options: --privileged
      volumes:
        - /tmp:/tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and setup build user
        run: |
          pacman -Sy --noconfirm archiso git base-devel devtools pacman-contrib
          # Create build user
          useradd -m -G wheel -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          # Set up build directory permissions
          chown -R builder:builder /__w/RetroGameStation-OS

      - name: Build local repo (gaming + RE + emulators)
        run: |
          sudo -u builder bash -c '
            cd /__w/RetroGameStation-OS/RetroGameStation-OS
            chmod +x scripts/setup-local-repo.sh
            ./scripts/setup-local-repo.sh
          '

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh --no-local-repo

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrogamestation-iso
          path: out/*.iso
          retention-days: 7

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: out/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
