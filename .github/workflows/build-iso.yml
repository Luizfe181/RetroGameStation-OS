name: Build RetroGameStation ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo pacman -Sy --noconfirm archiso git base-devel devtools

      - name: Build local repo (retrodev toolchains)
        run: |
          cd archiso-profile
          chmod +x scripts/setup-local-repo.sh
          ./scripts/setup-local-repo.sh --only-retrodev

      - name: Build ISO
        run: |
          cd archiso-profile
          chmod +x build.sh
          sudo ./build.sh --no-local-repo

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrogamestation-iso
          path: archiso-profile/out/*.iso
          retention-days: 7

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: archiso-profile/out/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
