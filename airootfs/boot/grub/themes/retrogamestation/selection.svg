<svg xmlns="http://www.w3.org/2000/svg" width="600" height="48" viewBox="0 0 600 48">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0"/>
      <stop offset="10%" stop-color="#00A8FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00A8FF" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#00A8FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="48" rx="4" fill="url(#neonGlow)" filter="url(#glow)"/>
  <rect x="2" y="2" width="596" height="44" rx="2" fill="none" stroke="#00A8FF" stroke-width="1" stroke-opacity="0.5"/>
</svg>