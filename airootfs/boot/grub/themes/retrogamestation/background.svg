<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="cobaltGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="50%" stop-color="#001122"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="neonCenter" cx="50%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0066AA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Deep black background -->
  <rect width="1920" height="1080" fill="#000000"/>
  
  <!-- Cobalt radial gradient -->
  <rect width="1920" height="1080" fill="url(#cobaltGlow)"/>
  
  <!-- Central neon glow -->
  <rect width="1920" height="1080" fill="url(#neonCenter)"/>
  
  <!-- Subtle scanlines for retro feel -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
    <rect width="4" height="2" fill="#000000" fill-opacity="0.03"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>
  
  <!-- Corner accents -->
  <g fill="none" stroke="#00A8FF" stroke-width="2" stroke-opacity="0.3">
    <!-- Top-left -->
    <path d="M 60 100 L 60 40 L 140 40"/>
    <!-- Top-right -->
    <path d="M 1860 100 L 1860 40 L 1780 40"/>
    <!-- Bottom-left -->
    <path d="M 60 980 L 60 1040 L 140 1040"/>
    <!-- Bottom-right -->
    <path d="M 1860 980 L 1860 1040 L 1780 1040"/>
  </g>
  
  <!-- Center logo placeholder -->
  <g opacity="0.4">
    <circle cx="960" cy="540" r="120" fill="none" stroke="#00A8FF" stroke-width="1"/>
    <circle cx="960" cy="540" r="80" fill="none" stroke="#00A8FF" stroke-width="1" stroke-dasharray="20 10"/>
    <text x="960" y="550" font-family="monospace" font-size="24" fill="#00A8FF" text-anchor="middle" letter-spacing="8">R G S</text>
  </g>
</svg>