# RetroGameStation Starship Configuration
# ~/.config/starship.toml

# Don't print a new line at the start of the prompt
add_newline = true

# Prompt format
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_commit\
$package\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
$conda\
$memory_usage\
$time\
$character"""

# Username
[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style) "
show_always = true
disabled = false

# Hostname
[hostname]
ssh_only = false
format = "@[$hostname](bold yellow) "
disabled = false

# Directory
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
disabled = false

# Git branch
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"
disabled = false

# Git status
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "="
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = "$"
modified = "!"
deleted = "×"
renamed = "→"
typechanged = ""
staged = "+"
show_sync_count = true
disabled = false

# Git commit
[git_commit]
commit_hash_length = 8
format = "[$hash]($style) "
style = "bold green"
disabled = true

# Package version
[package]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"
disabled = false

# Node.js
[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
disabled = false

# Rust
[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold red"
disabled = false

# Go
[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold cyan"
disabled = false

# Python
[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"
disabled = false
pyenv_version_name = true

# Docker context
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
disabled = false

# Kubernetes
[kubernetes]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold cyan"
disabled = false

# Memory usage
[memory_usage]
symbol = " "
format = "[$symbol$ram]($style) "
style = "bold magenta"
disabled = false
threshold = 75

# Time
[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M:%S"
style = "bold white"

# Character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# Custom commands for retrodev
[custom.ps2sdk]
command = "echo 'PS2: $(ee-gcc --version 2>/dev/null | head -1 | cut -d' ' -f3-)' || echo 'PS2: Not found'"
when = "test -d /opt/ps2sdk"
format = "[$output]($style) "
style = "bold blue"

[custom.devkitppc]
command = "echo 'PPC: $(powerpc-eabi-gcc --version 2>/dev/null | head -1 | cut -d' ' -f3-)' || echo 'PPC: Not found'"
when = "test -d /opt/devkitpro/devkitPPC"
format = "[$output]($style) "
style = "bold magenta"

[custom.devkitarm]
command = "echo 'ARM: $(arm-none-eabi-gcc --version 2>/dev/null | head -1 | cut -d' ' -f3-)' || echo 'ARM: Not found'"
when = "test -d /opt/devkitpro/devkitARM"
format = "[$output]($style) "
style = "bold cyan"

[custom.libnx]
command = "echo 'NX: $(aarch64-none-elf-gcc --version 2>/dev/null | head -1 | cut -d' ' -f3-)' || echo 'NX: Not found'"
when = "test -d /opt/libnx"
format = "[$output]($style) "
style = "bold green"