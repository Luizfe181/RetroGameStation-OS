---
# Calamares installer configuration for RetroGameStation
# /etc/calamares/settings.conf

branding: "RetroGameStation"
windowTitle: "RetroGameStation Installer"
windowIcon: "retrogamestation"
productName: "RetroGameStation"
version: "@VERSION@"
productUrl: "https://github.com/retrogamestation"
supportUrl: "https://github.com/retrogamestation/issues"
releaseNotesUrl: "https://github.com/retrogamestation/releases"

style: "RetroGameStation.qss"

# OEM install configuration
oem:
    enable: false

# Module settings
modules:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
    - install
    - bootloader
    - finished

# Module specific settings
moduleSettings:
    welcome:
        welcomeLabel: "Welcome to RetroGameStation Installer"
        welcomeText: |
            RetroGameStation is a hybrid Linux distribution focused on gaming (SteamOS-style with Gamescope)
            and retroconsole development (PS2, GameCube/Wii, GBA/NDS, 3DS, Switch, N64, Dreamcast, Saturn, PS1, PSP, Vita).
            
            This installer will guide you through the installation process.
        continueLabel: "Continue"

    locale:
        localeList: [ "pt_BR", "en_US", "es_ES", "fr_FR", "de_DE", "it_IT", "ja_JP", "ko_KR", "zh_CN", "zh_TW" ]
        localeDefault: "pt_BR"
        timezoneList: [ "America/Sao_Paulo", "America/New_York", "Europe/London", "Europe/Paris", "Europe/Berlin", "Asia/Tokyo", "Asia/Shanghai", "Australia/Sydney" ]
        timezoneDefault: "America/Sao_Paulo"

    keyboard:
        layoutList: [ "br", "us", "us-intl", "es", "fr", "de", "it", "jp", "kr", "cn" ]
        layoutDefault: "br"
        variantList: [ "", "abnt2", "nodeadkeys", "dvorak", "colemak" ]
        variantDefault: "abnt2"

    partition:
        autoPartition: true
        autoPartitionLabel: "Erase disk and install RetroGameStation"
        manualPartitionLabel: "Manual partitioning"
        advancedPartitionLabel: "Advanced partitioning (experts only)"

    users:
        avatarPath: "/usr/share/icons/RetroGameStation/avatar.png"
        defaultGroups: [ "wheel", "video", "audio", "optical", "storage", "power", "network", "input", "uucp", "lp", "games" ]
        autologinGroup: "autologin"
        doAutologin: true
        sudoersGroup: "wheel"
        setRootPassword: false
        availableShells: [ "/bin/bash", "/bin/zsh", "/bin/fish" ]
        defaultShell: "/bin/bash"
        userName: "gamer"
        realName: "RetroGamer"
        passwordHint: "Enter password for gamer user"

    bootloader:
        efiBootloader: "grub"
        efiDirectory: "/boot/efi"
        efiBootloaderId: "RetroGameStation"
        kernelOptions: "quiet splash rd.udev.log_priority=3 vga=current loglevel=3"
        grubTheme: "/usr/share/grub/themes/RetroGameStation/theme.txt"
        encryptBootPartition: false

    finished:
        rebootNow: true
        rebootLabel: "Restart now"
        showLog: true

# Display settings
display:
    scale: 1.0

# Debug settings
debug:
    enable: false
    verbosity: 0