<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#004488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#000000" stroke="#004488" stroke-width="2"/>
  
  <!-- Inner glow -->
  <circle cx="64" cy="64" r="55" fill="url(#iconGlow)"/>
  
  <!-- Retro gamepad silhouette -->
  <g fill="#00A8FF" opacity="0.9">
    <!-- D-pad -->
    <path d="M 54 48 L 74 48 L 74 68 L 54 68 Z" fill="#00A8FF"/>
    <path d="M 59 43 L 69 43 L 69 73 L 59 73 Z" fill="#00A8FF"/>
    
    <!-- Face buttons (A/B/X/Y) -->
    <circle cx="100" cy="58" r="10" fill="none" stroke="#00A8FF" stroke-width="2"/>
    <circle cx="82" cy="40" r="10" fill="none" stroke="#00A8FF" stroke-width="2"/>
    <circle cx="64" cy="58" r="10" fill="none" stroke="#00A8FF" stroke-width="2"/>
    <circle cx="82" cy="76" r="10" fill="none" stroke="#00A8FF" stroke-width="2"/>
  </g>
  
  <!-- RGS text -->
  <text x="64" y="105" font-family="monospace" font-size="14" font-weight="bold" fill="#00A8FF" text-anchor="middle" letter-spacing="2">RGS</text>
</svg>