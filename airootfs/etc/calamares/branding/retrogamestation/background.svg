<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#001122"/>
      <stop offset="50%" stop-color="#000811"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0066AA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="960" height="640" fill="#000000"/>
  <rect width="960" height="640" fill="url(#bgGlow)"/>
  <rect width="960" height="640" fill="url(#centerGlow)"/>
  
  <!-- Scanlines -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
    <rect width="4" height="2" fill="#000000" fill-opacity="0.02"/>
  </pattern>
  <rect width="960" height="640" fill="url(#scanlines)"/>
  
  <!-- Grid lines for retro-futuristic feel -->
  <g stroke="#00A8FF" stroke-width="0.5" stroke-opacity="0.05">
    <line x1="0" y1="0" x2="960" y2="640"/>
    <line x1="960" y1="0" x2="0" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
  </g>
  
  <!-- Corner brackets -->
  <g fill="none" stroke="#00A8FF" stroke-width="2" stroke-opacity="0.2">
    <path d="M 40 80 L 40 40 L 100 40"/>
    <path d="M 860 80 L 860 40 L 920 40"/>
    <path d="M 40 560 L 40 600 L 100 600"/>
    <path d="M 860 560 L 860 600 L 920 600"/>
  </g>
  
  <!-- Subtle center logo -->
  <g opacity="0.15">
    <circle cx="480" cy="320" r="80" fill="none" stroke="#00A8FF" stroke-width="1"/>
    <circle cx="480" cy="320" r="50" fill="none" stroke="#00A8FF" stroke-width="1" stroke-dasharray="15 8"/>
    <text x="480" y="328" font-family="monospace" font-size="32" fill="#00A8FF" text-anchor="middle" letter-spacing="12">RETROGAMESTATION</text>
  </g>
</svg>