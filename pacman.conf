#
# pacman.conf - Archiso pacman configuration for RetroGameStation
# Includes official repos + custom local repo for AUR/retrodev packages
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 8
ILoveCandy

# Custom local repository for AUR and retrodev packages (built locally)
[retrogamestation-local]
SigLevel = Optional TrustAll
Server = file:///var/cache/pacman/retrogamestation-local

# Official Arch Linux repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

# Multilib for 32-bit support (Steam, wine, etc.)
[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR - Prebuilt AUR packages (optional, faster than building)
# Uncomment if you want prebuilt AUR packages
#[chaotic-aur]
#Include = /etc/pacman.d/chaotic-mirrorlist

# Archlinuxcn repository (Chinese community repo with many gaming/retro packages)
# Uncomment if needed
#[archlinuxcn]
#SigLevel = Optional TrustAll
#Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxcn/$arch
#Server = https://mirrors.ustc.edu.cn/archlinuxcn/$arch
#Server = https://repo.archlinuxcn.org/$arch

# Liquorix Kernel repository (gaming-optimized kernel)
# Uncomment if you want Liquorix kernel instead of stock
#[liquorix]
#Server = https://liquorix.net/archlinux/$arch

# CachyOS repositories (performance optimized packages)
# Uncomment for CachyOS optimized builds
#[cachyOS]
#Server = https://mirror.cachyos.org/$repo/$arch
#Server = https://mirror.cachyos.net/$repo/$arch