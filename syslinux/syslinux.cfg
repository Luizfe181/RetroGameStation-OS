DEFAULT vesamenu.c32
PROMPT 0
TIMEOUT 300
MENU TITLE RetroGameStation OS - Boot Menu
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #004488 #000000
MENU COLOR title        1;36    #00A8FF #000000
MENU COLOR sel          7;36    #00A8FF #004488
MENU COLOR unsel        37      #CCCCCC #000000
MENU COLOR help         37      #888888 #000000
MENU COLOR timeout_msg  37      #FF6600 #000000
MENU COLOR timeout      1;37    #FF6600 #000000
MENU COLOR cmdmark      1;36    #00A8FF #000000
MENU COLOR cmdline      37      #CCCCCC #000000

LABEL gamescope
    MENU LABEL Boot Gamescope + Steam (RetroGameStation)
    MENU DEFAULT
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=RETROGAMESTATION_$(date +%Y%m) quiet splash systemd.unit=gamescope-session.service

LABEL desktop
    MENU LABEL Boot KDE Plasma Desktop
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=RETROGAMESTATION_$(date +%Y%m) quiet splash

LABEL console
    MENU LABEL Boot Console (TTY)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=RETROGAMESTATION_$(date +%Y%m) quiet splash systemd.unit=multi-user.target

LABEL existing
    MENU LABEL Boot Existing OS
    COM32 chain.c32
    APPEND hd0 1

MENU SEPARATOR

LABEL memtest
    MENU LABEL Memtest86+
    LINUX /arch/boot/memtest86+/memtest.bin

LABEL hdt
    MENU LABEL Hardware Detection Tool (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32